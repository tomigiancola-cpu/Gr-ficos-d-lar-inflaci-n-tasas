<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasa de plazo fijo, préstamos personales y diferencial</title>
<style>
  :root{
    color-scheme: light;
    --surface:      #fcfcfb;
    --page:         #f9f9f7;
    --ink-primary:  #0b0b0b;
    --ink-secondary:#52514e;
    --ink-muted:    #898781;
    --grid:         #e1e0d9;
    --baseline:     #c3c2b7;
    --border:       rgba(11,11,11,0.10);
    --series-1:     #2a78d6; /* Tasa plazo fijo */
    --series-2:     #eb6834; /* Tasa prestamos personales */
    --series-pos:   #1baf7a; /* Diferencial positivo (situación habitual) */
    --series-neg:   #e34948; /* Diferencial negativo (spread invertido) */
    --tooltip-bg:   #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --surface:      #1a1a19;
      --page:         #0d0d0d;
      --ink-primary:  #ffffff;
      --ink-secondary:#c3c2b7;
      --ink-muted:    #898781;
      --grid:         #2c2c2a;
      --baseline:     #383835;
      --border:       rgba(255,255,255,0.10);
      --series-1:     #3987e5;
      --series-2:     #d95926;
      --series-pos:   #199e70;
      --series-neg:   #e66767;
      --tooltip-bg:   #242423;
    }
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --surface:      #1a1a19;
    --page:         #0d0d0d;
    --ink-primary:  #ffffff;
    --ink-secondary:#c3c2b7;
    --ink-muted:    #898781;
    --grid:         #2c2c2a;
    --baseline:     #383835;
    --border:       rgba(255,255,255,0.10);
    --series-1:     #3987e5;
    --series-2:     #d95926;
    --series-pos:   #199e70;
    --series-neg:   #e66767;
    --tooltip-bg:   #242423;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--page);
    color: var(--ink-primary);
    font-family: Arial, Helvetica, sans-serif;
  }
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 24px 16px;
    max-width: 1180px;
    margin: 16px auto;
  }
  h1{
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ink-primary);
  }
  .subtitle{
    font-size: 0.9rem;
    color: var(--ink-secondary);
    margin: 0 0 6px;
  }
  .note{
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin: 0 0 12px;
  }
  .chart-wrap{ position: relative; }
  svg{ width: 100%; height: auto; display:block; overflow: visible; }
  .gridline{ stroke: var(--grid); stroke-width: 1; }
  .baseline{ stroke: var(--baseline); stroke-width: 1; }
  .zero-line{ stroke: var(--baseline); stroke-width: 1.3; }
  .axis-label{ fill: var(--ink-muted); font-size: 12px; }
  .panel-title{ fill: var(--ink-muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; }

  .band-pos, .band-neg{ stroke: none; }
  .band-pos{ fill: var(--series-pos); opacity: 0.14; }
  .band-neg{ fill: var(--series-neg); opacity: 0.14; }
  .band.hidden{ display:none; }

  .area-pos{ fill: var(--series-pos); opacity: 0.18; stroke: none; }
  .area-neg{ fill: var(--series-neg); opacity: 0.18; stroke: none; }
  .diff-line-pos{ stroke: var(--series-pos); }
  .diff-line-neg{ stroke: var(--series-neg); }

  .diff-annot.hidden{ display:none; }
  .avg-line{ stroke: var(--ink-muted); stroke-width: 1.3; stroke-dasharray: 4 3; }
  .avg-label{ fill: var(--ink-secondary); font-size: 11.5px; font-weight: 700; }
  .extreme-label{ font-size: 12px; font-weight: 700; }
  .extreme-sublabel{ font-size: 11px; fill: var(--ink-muted); }
  .extreme-leader{ stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 2; }

  .series-line{ fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
  .series-line.hidden{ display:none; }
  .end-dot{ stroke: var(--surface); stroke-width: 2px; }
  .end-dot.hidden{ display:none; }
  .end-label{ font-size: 13px; font-weight: 600; fill: var(--ink-secondary); }
  .end-label.hidden{ display:none; }
  .crosshair-line{ stroke: var(--baseline); stroke-width: 1; pointer-events:none; }
  .hover-dot{ stroke: var(--surface); stroke-width: 2px; pointer-events:none; }

  .legend{
    display:flex; flex-wrap: wrap; gap: 18px; align-items:center;
    margin: 14px 4px 4px;
  }
  .legend-item{
    display:flex; align-items:center; gap:8px;
    font-size: 0.92rem; color: var(--ink-secondary);
    cursor:pointer; user-select:none; background:none; border:none;
    padding: 4px 2px; font-family: inherit;
  }
  .legend-item .swatch{
    width: 18px; height: 3px; border-radius: 2px; flex:none;
  }
  .legend-item .swatch.split{
    background: linear-gradient(to right, var(--series-pos) 50%, var(--series-neg) 50%);
  }
  .legend-item.off{ opacity: 0.35; }
  .legend-item:focus-visible{ outline: 2px solid var(--series-1); outline-offset: 2px; }
  .legend-hint{ font-size: 0.78rem; color: var(--ink-muted); }

  .source{
    margin: 2px 4px 4px; font-size: 0.78rem; color: var(--ink-muted);
  }

  .toolbar{
    display:flex; justify-content:flex-end; margin: -4px 4px 8px;
  }
  .toolbar button{
    font-family: inherit; font-size: 0.85rem; color: var(--ink-secondary);
    background: var(--page); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor:pointer;
  }
  .toolbar button:hover{ color: var(--ink-primary); }

  .tooltip{
    position:absolute; pointer-events:none;
    background: var(--tooltip-bg); color: var(--ink-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 12.5px; line-height:1.5;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.08s ease;
    white-space: nowrap; z-index: 5;
  }
  .tooltip.visible{ opacity: 1; }
  .tooltip .t-date{ color: var(--ink-secondary); font-weight:600; margin-bottom:4px; }
  .tooltip .t-row{ display:flex; align-items:center; gap:6px; }
  .tooltip .t-row + .t-row{ margin-top:2px; }
  .tooltip .t-key{ width:10px; height:2px; border-radius:1px; flex:none; }
  .tooltip .t-val{ font-weight:700; margin-left:auto; padding-left:14px; font-variant-numeric: tabular-nums; }
  .tooltip .t-name{ color: var(--ink-secondary); }
  .tooltip .t-flag{ font-size: 11px; color: var(--series-neg); margin-top: 4px; max-width: 220px; white-space: normal; }

  .table-view{
    display:none; margin: 14px 4px 4px; max-height: 420px; overflow:auto;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .table-view.visible{ display:block; }
  table{ border-collapse: collapse; width:100%; font-size: 0.85rem; }
  thead th{
    position: sticky; top:0; background: var(--surface);
    text-align:right; padding: 8px 12px; color: var(--ink-secondary);
    border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums;
  }
  thead th:first-child, tbody td:first-child{ text-align:left; }
  tbody td{
    padding: 5px 12px; text-align:right; color: var(--ink-primary);
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid);
  }
  tbody tr:hover{ background: var(--page); }
</style>
</head>

<div class="card">
  <h1>Tasa de plazo fijo, préstamos personales y diferencial</h1>

  <div class="toolbar">

    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="legend" id="legend"></div>

  <p class="source">Fuente: BCRA</p>

  <div class="table-view" id="tableView">

      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

      const prevExtra = extraAt(i - 1), curExtra = extraAt(i);
      for (const k in prevExtra) crossExtra[k] = prevExtra[k] + frac * (curExtra[k] - prevExtra[k]);
      cur.points.push({ t: crossT, v: 0, extra: crossExtra });
      segments.push(cur);
      cur = { sign, points: [{ t: crossT, v: 0, extra: crossExtra }] };
    }
    if (!cur) cur = { sign, points: [] };
    cur.points.push({ t: dates[i], v, extra: extraAt(i) });
  }
  if (cur) segments.push(cur);
  return segments;
}

const bandSegments = buildSignedSegments(
  i => DATA[i][3],
  i => ({ top: DATA[i][2], bot: DATA[i][1] }) // top = prestamos, bot = plazoFijo
);

const bandGroup = el("g", { class: "band" }, svg);
bandSegments.forEach(seg => {
  let d = "";
  seg.points.forEach((p, i) => {
    const x = xScale(p.t), y = yTop(p.extra.top);
    d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
  });
  for (let i = seg.points.length - 1; i >= 0; i--) {
    const p = seg.points[i];
    const x = xScale(p.t), y = yTop(p.extra.bot);
    d += "L" + x.toFixed(2) + "," + y.toFixed(2) + " ";
  }
  d += "Z";
  el("path", { class: seg.sign > 0 ? "band-pos" : "band-neg", d }, bandGroup);
});

const RATE_SERIES = [
  { key: 1, name: "Tasa plazo fijo",           color: "var(--series-1)" },
  { key: 2, name: "Tasa préstamos personales", color: "var(--series-2)" },
];

const paths = {};
const endDots = {};
const endLabels = {};
RATE_SERIES.forEach(s => {
  let d = "";
  DATA.forEach((row, i) => {
    const x = xScale(dates[i]), y = yTop(row[s.key]);
    d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
  });
  const path = el("path", { class: "series-line", d, stroke: s.color }, svg);
  paths[s.key] = path;

  const last = DATA[DATA.length - 1];
  const ex = xScale(dates[dates.length - 1]), ey = yTop(last[s.key]);
  endDots[s.key] = el("circle", { class: "end-dot", cx: ex, cy: ey, r: 4, fill: s.color }, svg);
  const label = el("text", { class: "end-label", x: ex + 9, y: ey + 4 }, svg);
  label.textContent = last[s.key].toFixed(1);
  endLabels[s.key] = label;
});

// ================= BOTTOM PANEL =================
el("text", { class: "panel-title", x: M.left, y: bottomY0 - 8 }, svg).textContent = "DIFERENCIAL (PUNTOS PORCENTUALES)";

const botTicks = [];
for (let v = botMin; v <= botMax; v += 25) botTicks.push(v);
botTicks.forEach(v => {
  const y = yBottom(v);
  if (v !== 0) el("line", { class: "gridline", x1: M.left, x2: W - M.right, y1: y, y2: y }, svg);
  el("text", { class: "axis-label", x: M.left - 10, y: y + 4, "text-anchor": "end" }, svg).textContent = v;
});
el("line", { class: "zero-line", x1: M.left, x2: W - M.right, y1: zeroY, y2: zeroY }, svg);
el("line", { class: "baseline", x1: M.left, x2: M.left, y1: bottomY0, y2: bottomY1 }, svg);
el("line", { class: "baseline", x1: M.left, x2: W - M.right, y1: bottomY1, y2: bottomY1 }, svg);

const diffSegments = buildSignedSegments(i => DATA[i][3], i => ({}));
const diffAreaGroup = el("g", { class: "diff-area" }, svg);
const diffLineGroup = el("g", { class: "diff-line" }, svg);
diffSegments.forEach(seg => {
  let dArea = "M" + xScale(seg.points[0].t).toFixed(2) + "," + zeroY.toFixed(2) + " ";
  let dLine = "";
  seg.points.forEach((p, i) => {
    const x = xScale(p.t), y = yBottom(p.v);
    dArea += "L" + x.toFixed(2) + "," + y.toFixed(2) + " ";
    dLine += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
  });
  dArea += "L" + xScale(seg.points[seg.points.length - 1].t).toFixed(2) + "," + zeroY.toFixed(2) + " Z";
  el("path", { class: seg.sign > 0 ? "area-pos" : "area-neg", d: dArea }, diffAreaGroup);
  el("path", { class: "series-line " + (seg.sign > 0 ? "diff-line-pos" : "diff-line-neg"), d: dLine }, diffLineGroup);
});

const lastDiff = DATA[DATA.length - 1][3];
const diffEndColorVar = lastDiff >= 0 ? "--series-pos" : "--series-neg";
const dEx = xScale(dates[dates.length - 1]), dEy = yBottom(lastDiff);
const diffEndDot = el("circle", { class: "end-dot", cx: dEx, cy: dEy, r: 4, fill: `var(${diffEndColorVar})` }, svg);
const diffEndLabel = el("text", { class: "end-label", x: dEx + 9, y: dEy + 4 }, svg);
diffEndLabel.textContent = lastDiff.toFixed(1);

// --- annotations: record high, record low, period average ---
const annotGroup = el("g", { class: "diff-annot" }, svg);

let maxIdx = 0, minIdx = 0, sumDiff = 0;
for (let i = 0; i < DATA.length; i++) {
  if (DATA[i][3] > DATA[maxIdx][3]) maxIdx = i;
  if (DATA[i][3] < DATA[minIdx][3]) minIdx = i;
  sumDiff += DATA[i][3];
}
const avgDiff = sumDiff / DATA.length;

function fmtEs(v) { return v.toFixed(1).replace(".", ","); }

// period average, dashed reference line
const avgY = yBottom(avgDiff);
el("line", { class: "avg-line", x1: M.left, x2: W - M.right, y1: avgY, y2: avgY }, annotGroup);
const avgLabelText = `Promedio del período: ${fmtEs(avgDiff)} p.p.`;
const avgLabelAtTop = avgY - M.top < 22; // flip below the line if too close to the panel's top edge
const avgLabelY = avgLabelAtTop ? avgY + 14 : avgY - 6;
const avgLabelBg = el("rect", {
  x: M.left + 4, y: avgLabelY - 12, width: avgLabelText.length * 6.1 + 10, height: 16,
  fill: "var(--surface)", opacity: 0.88, rx: 3
}, annotGroup);
const avgLabel = el("text", { class: "avg-label", x: M.left + 9, y: avgLabelY }, annotGroup);
avgLabel.textContent = avgLabelText;

function addExtremeAnnotation(idx, kind) {
  const val = DATA[idx][3];
  const px = xScale(dates[idx]);
  const py = yBottom(val);
  const colorVar = val >= 0 ? "--series-pos" : "--series-neg";

  // A ring marker on the point itself; the value and date are carried by the
  // caption below the chart (colors match), which keeps the dense, volatile
  // 2023-2024 stretch free of overlapping floating labels.
  el("circle", {
    cx: px, cy: py, r: 6.5, fill: "none", stroke: `var(${colorVar})`, "stroke-width": 2
  }, annotGroup);
  el("circle", {
    cx: px, cy: py, r: 3, fill: `var(${colorVar})`, stroke: "var(--surface)", "stroke-width": 1.5
  }, annotGroup);
}

addExtremeAnnotation(maxIdx, "max");
addExtremeAnnotation(minIdx, "min");

// mirror the figures into the caption below the chart
const capMax = document.getElementById("capMax");
const capMin = document.getElementById("capMin");
const capAvg = document.getElementById("capAvg");
if (capMax) capMax.textContent = `Récord: ${fmtEs(DATA[maxIdx][3])} p.p. (${formatDate(DATA[maxIdx][0])})`;
if (capMin) capMin.textContent = `Mínimo: ${fmtEs(DATA[minIdx][3])} p.p. (${formatDate(DATA[minIdx][0])})`;
if (capAvg) capAvg.textContent = `Promedio del período: ${fmtEs(avgDiff)} p.p.`;

// ================= x-axis (shared) =================
const yearTicks = [];
const seenYears = new Set();
DATA.forEach(d => {
  const year = d[0].slice(0, 4);
  if (!seenYears.has(year)) { seenYears.add(year); yearTicks.push({ year, t: new Date(d[0] + "T00:00:00Z").getTime() }); }
});
yearTicks.forEach(({ year, t }) => {
  const x = xScale(t);
  el("text", { class: "axis-label", x: x, y: bottomY1 + 24, "text-anchor": "middle" }, svg).textContent = year;
});

// ================= hover layer =================
const hoverGroup = el("g", {}, svg);
const crosshair = el("line", { class: "crosshair-line", y1: topY0, y2: bottomY1, x1: 0, x2: 0 }, hoverGroup);
crosshair.style.opacity = 0;
const hoverDotTop = {};
RATE_SERIES.forEach(s => {
  hoverDotTop[s.key] = el("circle", { class: "hover-dot", r: 4, fill: s.color, cx: -100, cy: -100 }, hoverGroup);
});
const hoverDotBottom = el("circle", { class: "hover-dot", r: 4, fill: "var(--series-pos)", cx: -100, cy: -100 }, hoverGroup);

const capture = el("rect", {
  x: M.left, y: topY0, width: plotW, height: bottomY1 - topY0,
  fill: "transparent", style: "cursor:crosshair"
}, svg);

const tooltip = document.getElementById("tooltip");
const chartWrap = document.getElementById("chartWrap");
const visible = { 1: true, 2: true, diff: true };

function bisect(target) {
  let lo = 0, hi = dates.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (dates[mid] < target) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(dates[lo - 1] - target) < Math.abs(dates[lo] - target)) return lo - 1;
  return lo;
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${d} de ${meses[parseInt(m,10)-1]} de ${y}`;
}

function fmtNum(v){ return v.toLocaleString("es-AR", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function updateHover(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = svg.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  const t = xMin + ((loc.x - M.left) / plotW) * (xMax - xMin);
  const idx = Math.max(0, Math.min(dates.length - 1, bisect(t)));
  const row = DATA[idx];
  const x = xScale(dates[idx]);

  crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
  crosshair.style.opacity = 1;

  RATE_SERIES.forEach(s => {
    const dot = hoverDotTop[s.key];
    if (visible[s.key]) { dot.setAttribute("cx", x); dot.setAttribute("cy", yTop(row[s.key])); dot.style.opacity = 1; }
    else dot.style.opacity = 0;
  });
  if (visible.diff) {
    hoverDotBottom.setAttribute("cx", x);
    hoverDotBottom.setAttribute("cy", yBottom(row[3]));
    hoverDotBottom.setAttribute("fill", row[3] >= 0 ? "var(--series-pos)" : "var(--series-neg)");
    hoverDotBottom.style.opacity = 1;
  } else hoverDotBottom.style.opacity = 0;

  while (tooltip.firstChild) tooltip.removeChild(tooltip.firstChild);
  const dateEl = document.createElement("div");
  dateEl.className = "t-date";
  dateEl.textContent = formatDate(row[0]);
  tooltip.appendChild(dateEl);

  RATE_SERIES.forEach(s => {
    if (!visible[s.key]) return;
    const rowEl = document.createElement("div");
    rowEl.className = "t-row";
    const key = document.createElement("span");
    key.className = "t-key";
    key.style.background = getComputedStyle(document.documentElement).getPropertyValue(`--series-${s.key}`);
    const name = document.createElement("span");
    name.className = "t-name";
    name.textContent = s.name;
    const val = document.createElement("span");
    val.className = "t-val";
    val.textContent = fmtNum(row[s.key]) + "%";
    rowEl.appendChild(key); rowEl.appendChild(name); rowEl.appendChild(val);
    tooltip.appendChild(rowEl);
  });
  if (visible.diff) {
    const isPos = row[3] >= 0;
    const rowEl = document.createElement("div");
    rowEl.className = "t-row";
    const key = document.createElement("span");
    key.className = "t-key";
    key.style.background = isPos ? "var(--series-pos)" : "var(--series-neg)";
    const name = document.createElement("span");
    name.className = "t-name";
    name.textContent = "Diferencial";
    const val = document.createElement("span");
    val.className = "t-val";
    val.textContent = fmtNum(row[3]) + " p.p.";
    rowEl.appendChild(key); rowEl.appendChild(name); rowEl.appendChild(val);
    tooltip.appendChild(rowEl);
    if (!isPos) {
      const flag = document.createElement("div");
      flag.className = "t-flag";
      flag.textContent = "Spread invertido: el préstamo rindió menos que el plazo fijo";
      tooltip.appendChild(flag);
    }
  }

  const wrapRect = chartWrap.getBoundingClientRect();
  const scale = wrapRect.width / W;
  let left = (x) * scale + 14;
  const top = (topY0) * scale;
  const maxLeft = wrapRect.width - 230;
  if (left > maxLeft) left = (x) * scale - 230;
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
  tooltip.classList.add("visible");
}

function hideHover() {
  crosshair.style.opacity = 0;
  RATE_SERIES.forEach(s => hoverDotTop[s.key].style.opacity = 0);
  hoverDotBottom.style.opacity = 0;
  tooltip.classList.remove("visible");
}

capture.addEventListener("pointermove", e => updateHover(e.clientX, e.clientY));
capture.addEventListener("pointerleave", hideHover);
capture.addEventListener("touchmove", e => {
  if (e.touches[0]) { updateHover(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
}, { passive: false });

function updateBandVisibility() {
  bandGroup.classList.toggle("hidden", !(visible[1] && visible[2] && visible.diff));
}
function updateBottomPanelVisibility() {
  diffAreaGroup.classList.toggle("hidden", !visible.diff);
  diffLineGroup.classList.toggle("hidden", !visible.diff);
  diffEndDot.classList.toggle("hidden", !visible.diff);
  diffEndLabel.classList.toggle("hidden", !visible.diff);
  annotGroup.classList.toggle("hidden", !visible.diff);
}

// ================= legend =================
const legend = document.getElementById("legend");

function addLegendItem(swatchEl, labelText, onToggle) {
  const btn = document.createElement("button");
  btn.className = "legend-item";
  btn.type = "button";
  btn.setAttribute("aria-pressed", "true");
  btn.appendChild(swatchEl);
  const label = document.createElement("span");
  label.textContent = labelText;
  btn.appendChild(label);
  btn.addEventListener("click", () => {
    const nowVisible = onToggle();
    btn.classList.toggle("off", !nowVisible);
    btn.setAttribute("aria-pressed", String(nowVisible));
  });
  legend.appendChild(btn);
  return btn;
}

RATE_SERIES.forEach(s => {
  const sw = document.createElement("span");
  sw.className = "swatch";
  sw.style.background = s.color;
  addLegendItem(sw, s.name, () => {
    visible[s.key] = !visible[s.key];
    paths[s.key].classList.toggle("hidden", !visible[s.key]);
    endDots[s.key].classList.toggle("hidden", !visible[s.key]);
    endLabels[s.key].classList.toggle("hidden", !visible[s.key]);
    updateBandVisibility();
    return visible[s.key];
  });
});

const diffSw = document.createElement("span");
diffSw.className = "swatch split";
addLegendItem(diffSw, "Diferencial (préstamos − plazo fijo)", () => {
  visible.diff = !visible.diff;
  updateBandVisibility();
  updateBottomPanelVisibility();
  return visible.diff;
});

const hint = document.createElement("span");
hint.className = "legend-hint";
hint.textContent = "verde = spread habitual · rojo = spread invertido";
legend.appendChild(hint);

// ================= table view =================
const tableBody = document.getElementById("tableBody");
const frag = document.createDocumentFragment();
DATA.forEach(row => {
  const tr = document.createElement("tr");
  const cells = [formatDate(row[0]), fmtNum(row[1]) + "%", fmtNum(row[2]) + "%", fmtNum(row[3]) + " p.p."];
  cells.forEach(text => {
    const td = document.createElement("td");
    td.textContent = text;
    tr.appendChild(td);
  });
  frag.appendChild(tr);
});
tableBody.appendChild(frag);

const toggleBtn = document.getElementById("toggleTable");
const tableView = document.getElementById("tableView");
toggleBtn.addEventListener("click", () => {
  const showing = tableView.classList.toggle("visible");
  toggleBtn.textContent = showing ? "Ver como gráfico" : "Ver como tabla";
  toggleBtn.setAttribute("aria-pressed", String(showing));
});
</script>
</body>
</html>
