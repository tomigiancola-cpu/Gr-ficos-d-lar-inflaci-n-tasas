<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasa TAMAR Proyectada 2026 – Top 10 REM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --accent: #f0883e;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 40px 28px;
    max-width: 720px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #d29922);
  }
  .tag { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
  .chart-area { position: relative; height: 260px; margin-bottom: 20px; }
  svg.chart { width: 100%; height: 100%; overflow: visible; }
  .axis-label { font-family: 'Source Sans 3', sans-serif; font-size: 11px; fill: var(--muted); }
  .value-label { font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600; fill: var(--accent); }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .data-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .area { fill: url(#areaGrad2); }
  .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .footer-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 8px; }
  .source { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
  .highlight-box { background: rgba(240,136,62,0.08); border: 1px solid rgba(240,136,62,0.25); border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="tag">Tasas de Interés</div>
  <h2>TAMAR Proyectada — Bancos Privados</h2>
  <p class="subtitle">TNA % mensual promedio — Top 10 consultoras REM · BCRA, abril 2026</p>

  <div class="chart-area">
    <svg class="chart" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="areaGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f0883e" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- Grid -->
      <line class="grid-line" x1="60" y1="20" x2="620" y2="20"/>
      <line class="grid-line" x1="60" y1="72" x2="620" y2="72"/>
      <line class="grid-line" x1="60" y1="124" x2="620" y2="124"/>
      <line class="grid-line" x1="60" y1="176" x2="620" y2="176"/>
      <line class="grid-line" x1="60" y1="230" x2="620" y2="230"/>

      <!-- Y axis: range 19.0–24.5 = 5.5 TNA, height 210px, scale = 38.18px per unit -->
      <!-- Jun=23.15 → (24.5-23.15)*38.18=51.5 → y=20+51.5=71.5≈72 -->
      <!-- Jul=23.29 → (24.5-23.29)*38.18=46.2 → y=66 -->
      <!-- Ago=23.58 → (24.5-23.58)*38.18=35.1 → y=55 -->
      <!-- Sep=23.59 → (24.5-23.59)*38.18=34.7 → y=55 -->
      <!-- Oct=23.56 → (24.5-23.56)*38.18=35.9 → y=56 -->
      <!-- Dic=23.52 → (24.5-23.52)*38.18=37.4 → y=57 -->
      <!-- Hmm, the TAMAR is barely declining, shows near-flat trend -->
      <!-- Let's use a wider y range: 20-25, scale=210/5=42px per unit -->
      <!-- Jun=23.15 → (25-23.15)*42=77.7 → y=20+77.7=97.7≈98 -->
      <!-- Jul=23.29 → (25-23.29)*42=71.8 → y=92 -->
      <!-- Ago=23.58 → (25-23.58)*42=59.6 → y=80 -->
      <!-- Sep=23.59 → (25-23.59)*42=59.2 → y=79 -->
      <!-- Oct=23.56 → (25-23.56)*42=60.5 → y=80 -->
      <!-- Dic=23.52 → (25-23.52)*42=62.2 → y=82 -->
      <!-- Too flat. Let's use range 22.5–23.5, scale=210 -->
      <!-- Jun=23.15 → (23.5-23.15)/1.0*210=73.5 → y=230-73.5=156 -->
      <!-- Jul=23.29 → (23.5-23.29)/1.0*210=44.1 → y=230-44.1=186 -->
      <!-- Hmm that inverts it. Let me redo: y=20 is top (high value), y=230 is bottom (low) -->
      <!-- range: 23.6 (top/y=20) to 22.5 (bottom/y=230), span=1.1, scale=210/1.1=190.9 -->
      <!-- May=23.18 → (23.6-23.18)*190.9=80.2 → y=100 -->
      <!-- Jun=23.15 → (23.6-23.15)*190.9=85.9 → y=106 -->
      <!-- Jul=23.29 → (23.6-23.29)*190.9=59.2 → y=79 -->
      <!-- Ago=23.58 → (23.6-23.58)*190.9=3.8 → y=24 -->
      <!-- Sep=23.59 → (23.6-23.59)*190.9=1.9 → y=22 ... too compressed -->
      <!-- Use range 22.5 to 24.0, span=1.5, scale=210/1.5=140 -->
      <!-- Jun=23.15 → (24.0-23.15)*140=119 → y=20+119=139 -->
      <!-- Jul=23.29 → (24.0-23.29)*140=99.4 → y=119 -->
      <!-- Ago=23.58 → (24.0-23.58)*140=58.8 → y=79 -->
      <!-- Sep=23.59 → (24.0-23.59)*140=57.4 → y=77 -->
      <!-- Oct=23.56 → (24.0-23.56)*140=61.6 → y=82 -->
      <!-- Dic=23.52 → (24.0-23.52)*140=67.2 → y=87 -->

      <text class="axis-label" x="50" y="24" text-anchor="end">24,0%</text>
      <text class="axis-label" x="50" y="79" text-anchor="end">23,6%</text>
      <text class="axis-label" x="50" y="134" text-anchor="end">23,3%</text>
      <text class="axis-label" x="50" y="189" text-anchor="end">23,0%</text>
      <text class="axis-label" x="50" y="234" text-anchor="end">22,5%</text>

      <!-- Area -->
      <path class="area" d="
        M 60,230
        L 60,139
        L 172,119
        L 284,79
        L 396,77
        L 508,82
        L 620,87
        L 620,230 Z
      "/>
      <!-- Line -->
      <path class="data-line" d="M 60,139 L 172,119 L 284,79 L 396,77 L 508,82 L 620,87"/>

      <!-- Dots -->
      <circle class="dot" cx="60" cy="139" r="5"/>
      <circle class="dot" cx="172" cy="119" r="5"/>
      <circle class="dot" cx="284" cy="79" r="5"/>
      <circle class="dot" cx="396" cy="77" r="5"/>
      <circle class="dot" cx="508" cy="82" r="5"/>
      <circle class="dot" cx="620" cy="87" r="5"/>

      <!-- Value labels -->
      <text class="value-label" x="60" y="128" text-anchor="middle">23,15%</text>
      <text class="value-label" x="172" y="108" text-anchor="middle">23,29%</text>
      <text class="value-label" x="284" y="68" text-anchor="middle">23,58%</text>
      <text class="value-label" x="396" y="66" text-anchor="middle">23,59%</text>
      <text class="value-label" x="508" y="71" text-anchor="middle">23,56%</text>
      <text class="value-label" x="620" y="76" text-anchor="middle">23,52%</text>

      <!-- X axis labels -->
      <text class="axis-label" x="60" y="248" text-anchor="middle">Jun</text>
      <text class="axis-label" x="172" y="248" text-anchor="middle">Jul</text>
      <text class="axis-label" x="284" y="248" text-anchor="middle">Ago</text>
      <text class="axis-label" x="396" y="248" text-anchor="middle">Sep</text>
      <text class="axis-label" x="508" y="248" text-anchor="middle">Oct</text>
      <text class="axis-label" x="620" y="248" text-anchor="middle">Dic</text>

      <!-- Note arrow showing stabilization -->
      <line stroke="#f0883e" stroke-width="1" stroke-dasharray="3,3" x1="284" y1="40" x2="620" y2="50"/>
      <text class="axis-label" x="450" y="36" text-anchor="middle" fill="#f0883e" font-size="10">tasas se estabilizan</text>
    </svg>
  </div>

  <div class="footer-row">
    <span class="source">Fuente: REM – BCRA, abril 2026</span>
    <div class="highlight-box">Piso estimado: ~23,1% TNA</div>
  </div>
</div>
</body>
</html>
